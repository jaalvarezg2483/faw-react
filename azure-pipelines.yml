name: faw-react-railway-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - faw-react

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: faw-railway-ci

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: 20.x

  - script: npm install --global @railway/cli@5.26.0
    displayName: Install Railway CLI

  - bash: |
      set -euo pipefail

      if [[ -z "${RAILWAY_TOKEN:-}" || "${RAILWAY_TOKEN}" == '$('* ]]; then
        echo "RAILWAY_TOKEN is missing. Add it as a secret in faw-railway-ci."
        exit 1
      fi

      railway up . \
        --path-as-root \
        --ci \
        --project 3a07649e-e813-4d92-b7e3-a5a3939ea76c \
        --environment production \
        --service faw-web \
        --message "Azure DevOps $(Build.SourceVersion)"
    displayName: Deploy faw-web to Railway
    env:
      RAILWAY_TOKEN: $(RAILWAY_TOKEN)
