name: Validate and sync faw-react to Azure DevOps

on:
  push:
    branches:
      - faw-react
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faw-react-sync
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/faw_ci
      PAYLOAD_SECRET: ci-only-secret-for-build-validation
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      STORAGE_PROVIDER: local
    steps:
      - name: Checkout faw-react
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

  sync-azure:
    needs: validate
    runs-on: ubuntu-latest
    env:
      AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      AZURE_REPOSITORY: https://dev.azure.com/GrupoPurdy/Purdy%20Websites%20and%20Apps/_git/WebFaw-Flutterflow
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Azure DevOps credential
        run: |
          if [ -z "$AZURE_DEVOPS_PAT" ]; then
            echo "Missing repository secret AZURE_DEVOPS_PAT."
            exit 1
          fi

      - name: Mirror faw-react to Azure DevOps
        run: |
          authorization=$(printf ':%s' "$AZURE_DEVOPS_PAT" | base64 -w 0)
          git -c http.extraheader="AUTHORIZATION: Basic $authorization" \
            push "$AZURE_REPOSITORY" HEAD:refs/heads/faw-react
